org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# CPU architectures packaged into the APK.
# Chaquopy with Python 3.13 supports 64-bit only.
#   arm64-v8a          -> real phones (default, smallest APK)
#   arm64-v8a,x86_64   -> also runs in a PC emulator
vidgrab.abis=arm64-v8a
